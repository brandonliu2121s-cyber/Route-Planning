<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIL &middot; Custom Route Builder</title>
<style>
  :root {
    --navy-deep: #0A1929;
    --navy-mid: #122B45;
    --navy-line: #22405E;
    --pil-red: #D6423A;
    --teal: #2DD8C5;
    --amber: #F4A93E;
    --fog: #E8EEF4;
    --slate: #7E96AF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--navy-deep);
    color: var(--fog);
    padding: 26px 20px 44px;
  }
  .disp { font-family: Georgia, "Times New Roman", serif; }
  .mono { font-family: "Courier New", Consolas, monospace; }
  .card { background: var(--navy-mid); border: 1px solid var(--navy-line); border-radius: 10px; }
  input[type=range] { accent-color: var(--teal); width: 100%; }
  select, button, input { font-family: inherit; }
  button { cursor: pointer; }
  .iconBtn { background: none; border: none; color: var(--slate); padding: 2px 4px; font-size: 13px; line-height: 1; }
  .iconBtn:hover { color: var(--fog); }
  .iconBtn:disabled { opacity: 0.3; cursor: default; }
  .gaugePriceInput {
    width: 40px; font-size: 9.5px; color: var(--slate); background: transparent;
    border: 1px solid transparent; border-radius: 3px; text-align: center;
    padding: 1px 2px; font-family: inherit;
  }
  .gaugePriceInput:hover { border-color: var(--navy-line); }
  .gaugePriceInput:focus { outline: none; border-color: var(--teal); color: var(--fog); background: var(--navy-deep); }
  /* hide number input spinner arrows so it reads like a label, not a form field, until focused */
  .gaugePriceInput::-webkit-outer-spin-button, .gaugePriceInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .gaugePriceInput[type=number] { -moz-appearance: textfield; }
  .chip { display: flex; align-items: center; justify-content: space-between; background: var(--navy-deep); border: 1px solid var(--navy-line); border-radius: 20px; padding: 5px 6px 5px 12px; font-size: 12px; margin-bottom: 6px; }
  .portDot { cursor: pointer; }
  .portDot:hover circle { filter: brightness(1.3); }
  .vesselBtn { flex: 1; padding: 8px 6px; border-radius: 6px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--navy-line); background: transparent; color: var(--slate); }
  .vesselBtn.active { border-color: var(--teal); background: rgba(45,216,197,0.12); color: var(--teal); }
  .kpiGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .mainGrid { display: grid; grid-template-columns: minmax(280px, 330px) 1fr; gap: 16px; }
  .chartGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 880px) {
    .mainGrid { grid-template-columns: 1fr; }
    .chartGrid { grid-template-columns: 1fr; }
  }
  label.fieldLabel { font-size: 12px; color: var(--slate); display: flex; justify-content: space-between; margin-bottom: 4px; }
  ::-webkit-scrollbar { height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--navy-line); border-radius: 4px; }
</style>
</head>
<body>

<div id="app"></div>

// opens already showing genuinely computed prices instead of placeholders.
// =============================================================================

    Object.entries(PYTHON_LIVE_DATA.vessels).forEach(([cls, specs]) => { if (VESSEL_CLASSES[cls]) Object.assign(VESSEL_CLASSES[cls], specs); });
  }
}

const GRID_STEP = 10;

// =============================================================================
// GEOMETRY + ALGORITHMS
// =============================================================================
function haversineNm(lat1, lon1, lat2, lon2) {
  const R_NM = 3440.065;
  const toRad = d => d * Math.PI / 180;
  const p1 = toRad(lat1), p2 = toRad(lat2);
  const dp = toRad(lat2 - lat1), dl = toRad(lon2 - lon1);
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return R_NM * 2 * Math.asin(Math.sqrt(a));
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

// If Python injected exact leg distances/consumption for the SPECIFIC route
// it computed (same ports, same order), use those numbers directly instead
// of recomputing via haversine -- so the popped-up dashboard matches the
// Python console output exactly, not just approximately. The moment the
// user edits the route to something Python didn't compute, this falls back
// to the normal haversine calculation automatically.
//
// Idle/hotel consumption while congested is added on top either way --
// Python's engine has no concept of congestion (it's an HTML-only
// feature), so its injected numbers are sailing-fuel only. A vessel
// waiting at anchor for a berth still runs auxiliary generators (hotel
// load, reefer plugs, systems) -- far less than underway main-engine
// consumption, but not zero. idleConsumptionMtPerDay is a single
// illustrative rate, adjustable in the Edit Reference Data panel.
function buildRoute(portNames, vessel) {
  const usePythonLegs = PYTHON_LIVE_DATA && PYTHON_LIVE_DATA.route && PYTHON_LIVE_DATA.legDistanceNm
    && PYTHON_LIVE_DATA.legConsumptionMt && arraysEqual(PYTHON_LIVE_DATA.route, portNames);

  // Fuel consumption scales roughly with the CUBE of speed (the standard
  // naval-architecture approximation used for bunker/voyage planning),
  // while transit time scales inversely with speed -- net effect, total
  // fuel burned to cover a FIXED distance scales with speed SQUARED. This
  // is the actual mechanism behind "slow steaming" cutting bunker costs,
  // not just a longer voyage. speedRatio=1 (operating at design speed)
  // changes nothing.
  const speedRatio = vessel.actualSpeedKnots / vessel.serviceSpeedKnots;
  const distanceFuelScale = speedRatio * speedRatio;

  return portNames.map((name, i) => {
    const idleConsumption = (PORTS_DB[name].congestionDays || 0) * (state.idleConsumptionMtPerDay || 0);
    let legDistanceNm, sailConsumptionAtDesignSpeed;
    if (usePythonLegs) {
      legDistanceNm = PYTHON_LIVE_DATA.legDistanceNm[name] || 0;
      sailConsumptionAtDesignSpeed = PYTHON_LIVE_DATA.legConsumptionMt[name] || 0;
    } else {
      const info = PORTS_DB[name];
      legDistanceNm = 0;
      if (i > 0) {
        const prev = PORTS_DB[portNames[i - 1]];
        legDistanceNm = haversineNm(prev.lat, prev.lon, info.lat, info.lon);
      }
      const legDaysAtDesignSpeed = legDistanceNm / (vessel.serviceSpeedKnots * 24);
      sailConsumptionAtDesignSpeed = legDaysAtDesignSpeed * vessel.dailyConsumptionMt;
    }
    const sailConsumption = sailConsumptionAtDesignSpeed * distanceFuelScale;
    return { port: name, legDistanceNm, legConsumption: sailConsumption + idleConsumption, sailConsumption, idleConsumption };
  });
}

// Dynamic programming optimiser -- shortest path over discretised fuel states
function optimizeBunkering(route, prices, vessel) {
  const buf = vessel.safetyBufferMt, cap = vessel.tankCapacityMt;
  const nStates = Math.floor((cap - buf) / GRID_STEP) + 1;
  const states = Array.from({ length: nStates }, (_, i) => buf + i * GRID_STEP);
  const n = route.length;
  const INF = Infinity;

  const dp = Array.from({ length: n }, () => new Array(nStates).fill(INF));
  const parent = Array.from({ length: n }, () => new Array(nStates).fill(-1));
  const bunkered = Array.from({ length: n }, () => new Array(nStates).fill(0));

  const price0 = prices[route[0].port];
  for (let s = 0; s < nStates; s++) {
    const target = states[s];
    if (target < vessel.startingFuelMt - 1e-6) continue;
    const bunker = target - vessel.startingFuelMt;
    dp[0][s] = bunker * price0;
    bunkered[0][s] = bunker;
  }

  for (let i = 1; i < n; i++) {
    const legConsumption = route[i].legConsumption;
    const price = prices[route[i].port];
    for (let sPrev = 0; sPrev < nStates; sPrev++) {
      if (dp[i - 1][sPrev] === INF) continue;
      let fuelArrive = states[sPrev] - legConsumption;
      if (fuelArrive < buf - 1e-6) continue;
      fuelArrive = Math.max(fuelArrive, buf);

      let sFree = Math.floor((fuelArrive - buf) / GRID_STEP);
      sFree = Math.min(Math.max(sFree, 0), nStates - 1);

      for (let sNew = sFree; sNew < nStates; sNew++) {
        const bunker = sNew === sFree ? 0 : states[sNew] - fuelArrive;
        const cost = dp[i - 1][sPrev] + bunker * price;
        if (cost < dp[i][sNew]) {
          dp[i][sNew] = cost;
          parent[i][sNew] = sPrev;
          bunkered[i][sNew] = bunker;
        }
      }
    }
  }

  const last = n - 1;
  let bestS = -1, bestCost = INF;
  for (let s = 0; s < nStates; s++) {
    const tieBreak = (states[s] - buf) * 1e-6;
    if (dp[last][s] + tieBreak < bestCost) { bestCost = dp[last][s] + tieBreak; bestS = s; }
  }
  if (bestS === -1) return { feasible: false };

  const plan = [];
  let s = bestS;
  for (let i = last; i >= 0; i--) {
    plan.unshift({ port: route[i].port, bunkerMt: Math.round(bunkered[i][s] * 10) / 10, fuelAfterMt: Math.round(states[s] * 10) / 10, price: prices[route[i].port] });
    s = i > 0 ? parent[i][s] : -1;
  }
  return { feasible: true, plan, totalCost: dp[last][bestS] };
}

function baselineJIT(route, prices, vessel) {
  const buf = vessel.safetyBufferMt;
  let fuel = vessel.startingFuelMt;
  const plan = [];
  let totalCost = 0;
  for (let i = 0; i < route.length; i++) {
    if (i > 0) {
      fuel -= route[i].legConsumption;
      if (fuel < buf - 1e-6) return { feasible: false };
    }
    const nextLeg = i < route.length - 1 ? route[i + 1].legConsumption : 0;
    const bunker = Math.max(0, buf + nextLeg - fuel);
    fuel += bunker;
    const cost = bunker * prices[route[i].port];
    totalCost += cost;
    plan.push({ port: route[i].port, bunkerMt: Math.round(bunker * 10) / 10, fuelAfterMt: Math.round(fuel * 10) / 10, price: prices[route[i].port] });
  }
  return { feasible: true, plan, totalCost };
}

// =============================================================================
// MAP PROJECTION (fixed bounding box over the full port database)
// =============================================================================
// 3D GLOBE MATH -- lat/lon -> unit sphere -> rotate -> orthographic project.
// Route arcs use spherical interpolation (slerp) so they hug the sphere's
// surface as true great-circle paths, not straight lines through the globe.
// =============================================================================
function latLonToVec3(lat, lon) {
  const latR = lat * Math.PI / 180, lonR = lon * Math.PI / 180;
  // x = screen left-right, z = depth (front/back hemisphere). x must use
  // sin(lon) so increasing longitude (east) moves a front-facing point
  // rightward, matching a real globe viewed from outside with north up --
  // the previous x=cos(lon)/z=sin(lon) pairing had these swapped, which
  // mirrored the whole world east-west (e.g. Cape Town rendered east of
  // Singapore, when it's actually west of it).
  return { x: Math.cos(latR) * Math.sin(lonR), y: Math.sin(latR), z: Math.cos(latR) * Math.cos(lonR) };
}

function rotateVec(v, yaw, pitch) {
  const x1 = v.x * Math.cos(yaw) + v.z * Math.sin(yaw);
  const z1 = -v.x * Math.sin(yaw) + v.z * Math.cos(yaw);
  const y2 = v.y * Math.cos(pitch) - z1 * Math.sin(pitch);
  const z2 = v.y * Math.sin(pitch) + z1 * Math.cos(pitch);
  return { x: x1, y: y2, z: z2 };
}

function slerp(v0, v1, t) {
  const dot = Math.max(-1, Math.min(1, v0.x * v1.x + v0.y * v1.y + v0.z * v1.z));
  const theta = Math.acos(dot);
  if (theta < 1e-6) return v0;
  const s = Math.sin(theta);
  const a = Math.sin((1 - t) * theta) / s, b = Math.sin(t * theta) / s;
  return { x: a * v0.x + b * v1.x, y: a * v0.y + b * v1.y, z: a * v0.z + b * v1.z };
}

// Clips a (rotated, view-space) polygon ring to the visible front
// hemisphere (z >= 0), inserting an interpolated point at each edge that
// crosses the horizon and re-projecting it onto the unit sphere -- this is
// what lets continents fill correctly right up to the sphere's silhouette
// instead of smearing across to the back side.
function intersectZPlane(a, b) {
  const t = a.z / (a.z - b.z);
  const x = a.x + t * (b.x - a.x), y = a.y + t * (b.y - a.y);
  const len = Math.sqrt(x * x + y * y) || 1;
  return { x: x / len, y: y / len, z: 0 };
}

function clipToFrontHemisphere(points) {
  const out = [];
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const curr = points[i], prev = points[(i - 1 + n) % n];
    const currIn = curr.z >= 0, prevIn = prev.z >= 0;
    if (currIn) {
      if (!prevIn) out.push(intersectZPlane(prev, curr));
      out.push(curr);
    } else if (prevIn) {
      out.push(intersectZPlane(prev, curr));
    }
  }
  return out;
}

// view state for the globe (camera rotation) -- kept OUTSIDE `state` since
// dragging the globe is a view preference, not app data, and shouldn't
// trigger a full app re-render on every mousemove frame
const DEFAULT_YAW = -0.96, DEFAULT_PITCH = -0.32;
let viewRotation = { yaw: DEFAULT_YAW, pitch: DEFAULT_PITCH };
let autoRotate = false;
let isDragging = false, dragMoved = false, dragStart = { x: 0, y: 0 }, dragStartRotation = { yaw: 0, pitch: 0 };
let globeLayout = { cx: 0, cy: 0, r: 0 };
let portScreenPos = {}; // populated each drawGlobe() call, used for click hit-testing
let lastDerived = null; // cached optimiser result, reused while dragging (no need to re-solve the DP just to rotate the camera)

// =============================================================================
// STATE
// =============================================================================
const INITIAL_VESSEL_CLASS = (PYTHON_LIVE_DATA && PYTHON_LIVE_DATA.vesselClass) || "O-Class";
let state = {
  vesselClass: INITIAL_VESSEL_CLASS,
  vesselName: (PYTHON_LIVE_DATA && PYTHON_LIVE_DATA.vesselName) || FLEET_VESSELS[INITIAL_VESSEL_CLASS][0],
  routePorts: (PYTHON_LIVE_DATA && PYTHON_LIVE_DATA.route) ? [...PYTHON_LIVE_DATA.route] : [...DEFAULT_ROUTE],
  startingFuel: (PYTHON_LIVE_DATA && PYTHON_LIVE_DATA.startingFuel) || VESSEL_CLASSES[INITIAL_VESSEL_CLASS].startingFuelMt,
  buffer: (PYTHON_LIVE_DATA && PYTHON_LIVE_DATA.buffer) || VESSEL_CLASSES[INITIAL_VESSEL_CLASS].safetyBufferMt,
  speedKnots: VESSEL_CLASSES[INITIAL_VESSEL_CLASS].serviceSpeedKnots,
  disruptPort: "None",
  spikePct: 0,
  closed: false,
  editPanelOpen: false,
  voyageStartDate: new Date().toISOString().slice(0, 10),
  fleetVesselsApplying: 100,
  fleetVoyagesPerYear: 6,
  opCostsOpen: false,
  opCostsEnabled: false,
  portDuesUsd: 8000,
  deliveryFeeUsd: 5000,
  congestionCostPerDay: 15000,
  idleConsumptionMtPerDay: 5,
};

const VESSEL_CLASS_SHORT_LABEL = { "O-Class": "O-Class", "E/EL-Class": "E/EL-Class", "LNG Dual-Fuel (Newbuild)": "LNG Dual-Fuel" };

function computeDerived(s) {
  const classSpec = VESSEL_CLASSES[s.vesselClass];
  const vessel = {
    ...classSpec,
    startingFuelMt: s.startingFuel,
    safetyBufferMt: s.buffer,
    // serviceSpeedKnots (spread above) stays the vessel's fixed design/
    // reference speed. actualSpeedKnots is the operator's chosen speed for
    // THIS voyage -- can differ (slow steaming) -- see buildRoute() for how
    // that changes fuel consumption, not just transit time.
    actualSpeedKnots: s.speedKnots || classSpec.serviceSpeedKnots,
  };
  const route = buildRoute(s.routePorts, vessel);
  const prices = {};
  s.routePorts.forEach(name => prices[name] = PORTS_DB[name].price);

  // Fuel-grade constraint: an LNG dual-fuel vessel can only bunker LNG at
  // ports that actually supply it -- far fewer than VLSFO. Reuses the same
  // "price so high it's never chosen unless unavoidable" mechanism as the
  // port-closure stress test, so the existing enforceClosure() safeguard
  // below automatically catches the case where LNG availability makes a
  // route genuinely infeasible, rather than pricing a phantom purchase.
  if (vessel.fuelGrade === "LNG") {
    s.routePorts.forEach(name => { if (!PORTS_DB[name].lngAvailable) prices[name] = 1e9; });
  }

  if (s.disruptPort !== "None" && prices[s.disruptPort] !== undefined) {
    prices[s.disruptPort] = s.closed ? 1e9 : prices[s.disruptPort] * (1 + s.spikePct / 100);
  }
  const canCompute = s.routePorts.length >= 2;
  // A "closed" port (price sentinel >= 1e8) is a solver trick to discourage
  // bunkering there -- it is NOT a real purchase price. If a strategy still
  // ends up buying fuel there because it has no alternative, that strategy
  // is genuinely infeasible (you cannot actually buy fuel at a closed
  // port), so report it as infeasible rather than an absurd dollar figure.
  const enforceClosure = (result) => {
    if (!result.feasible) return result;
    const stuck = result.plan.some(p => p.bunkerMt > 0.5 && prices[p.port] >= 1e8);
    return stuck ? { feasible: false } : result;
  };
  const optResult = canCompute ? enforceClosure(optimizeBunkering(route, prices, vessel)) : { feasible: false };
  const jitResult = canCompute ? enforceClosure(baselineJIT(route, prices, vessel)) : { feasible: false };
  const totalNm = route.reduce((sum, r) => sum + r.legDistanceNm, 0);
  const totalConsumed = route.reduce((sum, r) => sum + r.legConsumption, 0);
  const totalTonMilesM = totalNm * vessel.dwtMt / 1e6;
  const savings = (optResult.feasible && jitResult.feasible) ? jitResult.totalCost - optResult.totalCost : null;
  const savingsPct = savings !== null ? 100 * savings / jitResult.totalCost : null;
  const bunkerByPort = {};
  if (optResult.feasible) optResult.plan.forEach(p => bunkerByPort[p.port] = p.bunkerMt);
  return { vessel, route, prices, optResult, jitResult, totalNm, totalConsumed, totalTonMilesM, savings, savingsPct, bunkerByPort };
}

function esc(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function renderKPI(iconSvg, iconColor, label, value, highlight) {
  return `<div class="card" style="padding:12px 14px;${highlight ? "border-color:var(--teal)" : ""}">
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;">
      <span style="color:${iconColor}">${iconSvg}</span>
      <span style="font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:0.5px;">${label}</span>
    </div>
    <div class="mono" style="font-size:17px;font-weight:600;color:${highlight ? "var(--teal)" : "#fff"}">${value}</div>
  </div>`;
}

// Draws directly to the canvas -- called after every full render() AND on
// every drag mousemove frame. Deliberately does NOT touch the rest of the
// DOM or recompute the optimiser, so dragging the globe stays smooth.
function drawGlobe() {
  const canvas = document.getElementById("globeCanvas");
  if (!canvas) return;
  const d = lastDerived;
  const cssW = canvas.clientWidth || 900, cssH = canvas.clientHeight || 480;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const cx = cssW / 2, cy = cssH / 2, R = Math.min(cssW, cssH) / 2 * 0.86;
  globeLayout = { cx, cy, r: R };
  const { yaw, pitch } = viewRotation;
  const proj = (lat, lon) => {
    const rv = rotateVec(latLonToVec3(lat, lon), yaw, pitch);
    return { x: cx + rv.x * R, y: cy - rv.y * R, z: rv.z };
  };

  // background panel
  ctx.fillStyle = "#0D2038";
  ctx.fillRect(0, 0, cssW, cssH);

  // sphere body with a soft radial "lit" gradient for a pseudo-3D look
  const grad = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
  grad.addColorStop(0, "#1B4A6E");
  grad.addColorStop(0.55, "#123249");
  grad.addColorStop(1, "#0B2135");
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.save();
  ctx.clip(); // keep everything below clipped to the sphere disc

  // continents -- clip each ring to the visible hemisphere, then fill
  ctx.fillStyle = "#2F6355";
  ctx.strokeStyle = "#4C8570";
  ctx.lineWidth = 0.6;
  LAND_RINGS.forEach(ring => {
    const rotated = ring.map(([lon, lat]) => rotateVec(latLonToVec3(lat, lon), yaw, pitch));
    const clipped = clipToFrontHemisphere(rotated);
    if (clipped.length < 3) return;
    ctx.beginPath();
    clipped.forEach((p, i) => {
      const sx = cx + p.x * R, sy = cy - p.y * R;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  // subtle limb-darkening vignette for a lit-sphere feel
  const vignette = ctx.createRadialGradient(cx, cy, R * 0.65, cx, cy, R);
  vignette.addColorStop(0, "rgba(5,15,25,0)");
  vignette.addColorStop(1, "rgba(5,15,25,0.35)");
  ctx.fillStyle = vignette;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = "#2A4F70";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  // lat/long grid -- only draw the front-facing (visible) half of each line
  ctx.strokeStyle = "#25486A";
  ctx.lineWidth = 0.75;
  const drawGreatCirclePolyline = (points, style) => {
    ctx.strokeStyle = style.color;
    ctx.lineWidth = style.width;
    ctx.setLineDash(style.dash || []);
    ctx.beginPath();
    let penDown = false;
    points.forEach(p => {
      if (p.z < -0.03) { penDown = false; return; }
      if (!penDown) { ctx.moveTo(p.x, p.y); penDown = true; } else { ctx.lineTo(p.x, p.y); }
    });
    ctx.stroke();
    ctx.setLineDash([]);
  };

  for (let lon = -150; lon <= 180; lon += 30) {
    const pts = [];
    for (let lat = -90; lat <= 90; lat += 6) pts.push(proj(lat, lon));
    drawGreatCirclePolyline(pts, { color: "#1E3E5C", width: 0.75 });
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = [];
    for (let lon = -180; lon <= 180; lon += 6) pts.push(proj(lat, lon));
    drawGreatCirclePolyline(pts, { color: "#1E3E5C", width: 0.75 });
  }

  // route arcs (great-circle, via slerp) between consecutive route ports
  for (let i = 1; i < state.routePorts.length; i++) {
    const a = PORTS_DB[state.routePorts[i - 1]], b = PORTS_DB[state.routePorts[i]];
    const v0 = latLonToVec3(a.lat, a.lon), v1 = latLonToVec3(b.lat, b.lon);
    const pts = [];
    for (let t = 0; t <= 1.0001; t += 1 / 48) {
      const sv = slerp(v0, v1, Math.min(t, 1));
      const rv = rotateVec(sv, yaw, pitch);
      pts.push({ x: cx + rv.x * R, y: cy - rv.y * R, z: rv.z });
    }
    drawGreatCirclePolyline(pts, { color: "#2DD8C5", width: 2.2 });
  }

  // ports -- draw back-facing first, front-facing on top; cache screen
  // positions (visible ones only) for click hit-testing
  portScreenPos = {};
  const bunkerByPort = d ? d.bunkerByPort : {};
  const maxBunker = Math.max(...Object.values(bunkerByPort), 1);
  const entries = Object.entries(PORTS_DB).map(([name, info]) => ({ name, info, p: proj(info.lat, info.lon) }));
  entries.sort((a, b) => a.p.z - b.p.z);

  entries.forEach(({ name, info, p }) => {
    const inRoute = state.routePorts.includes(name);
    const behind = p.z < -0.03;
    const alpha = behind ? 0.16 : 1;
    const bunker = bunkerByPort[name] || 0;
    const ringR = inRoute && bunker > 1 ? 7 + (bunker / maxBunker) * 12 : 0;

    ctx.globalAlpha = alpha;
    if (ringR > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, ringR, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(45,216,197,0.22)";
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, inRoute ? 5.5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = inRoute ? "#2DD8C5" : "#3E5A7A";
    ctx.fill();
    if (inRoute) { ctx.lineWidth = 1; ctx.strokeStyle = "#fff"; ctx.stroke(); }

    if (!behind) {
      ctx.fillStyle = inRoute ? "#fff" : "#7E96AF";
      ctx.font = "9.5px -apple-system, Segoe UI, sans-serif";
      ctx.fillText(name, p.x + 8, p.y + 3);
    }
    ctx.globalAlpha = 1;

    if (!behind) portScreenPos[name] = { x: p.x, y: p.y };
  });
}

function hitTestPort(canvasClientX, canvasClientY) {
  const canvas = document.getElementById("globeCanvas");
  if (!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  const x = canvasClientX - rect.left, y = canvasClientY - rect.top;
  let best = null, bestDist = 14; // px hit-radius
  Object.entries(portScreenPos).forEach(([name, p]) => {
    const dist = Math.hypot(p.x - x, p.y - y);
    if (dist < bestDist) { bestDist = dist; best = name; }
  });
  return best;
}

  return html;
}

// =============================================================================
// RECOMMENDATION + VOYAGE ROADMAP -- translates the optimiser's raw numbers
// into a plain-English recommendation and a leg-by-leg voyage plan with
// estimated dates, so the output is something an ops team or executive can
// actually act on, not just read as a chart.
// =============================================================================
function generateRecommendationText(d) {
  if (!d.optResult.feasible) return null;
  const plan = d.optResult.plan;
  const bunkered = plan.filter(p => p.bunkerMt > 1).sort((a, b) => b.bunkerMt - a.bunkerMt);
  const skipped = plan.filter(p => p.bunkerMt <= 1);
  const sentences = [];

  if (bunkered.length === 0) {
    sentences.push(`No bunkering is needed anywhere on this route \u2014 starting fuel (${Math.round(state.startingFuel).toLocaleString()} MT) is enough to complete the full voyage within the safety buffer.`);
  } else {
    const primary = bunkered[0];
    sentences.push(`Bunker heavily at <strong style="color:var(--teal)">${esc(primary.port)}</strong> (${primary.price >= 1e8 ? "port closed in this scenario" : `$${primary.price.toFixed(0)}/MT`}) \u2014 purchase <strong>${primary.bunkerMt.toLocaleString()} MT</strong> here.`);
    const secondary = bunkered.slice(1);
    if (secondary.length) {
      const parts = secondary.map(p => `${esc(p.port)} (+${p.bunkerMt.toLocaleString()} MT)`).join(", ");
      sentences.push(`Top up lightly at ${parts}.`);
    }
  }

  if (skipped.length) {
    const names = skipped.map(p => esc(p.port)).join(", ");
    sentences.push(`Skip bunkering entirely at ${names} \u2014 no purchase needed there this voyage.`);
  }

  if (d.savings !== null && d.savings > 0) {
    sentences.push(`Projected total fuel spend: <strong>$${Math.round(d.optResult.totalCost).toLocaleString()}</strong> \u2014 a saving of <strong style="color:var(--teal)">$${Math.round(d.savings).toLocaleString()} (${d.savingsPct.toFixed(1)}%)</strong> versus a price-blind, buy-as-needed approach.`);
  } else if (d.savings !== null) {
    sentences.push(`Projected total fuel spend: <strong>$${Math.round(d.optResult.totalCost).toLocaleString()}</strong>.`);
  }

  if (state.disruptPort !== "None") {
    if (state.closed) {
      sentences.push(`Active scenario: <strong>${esc(state.disruptPort)}</strong> is unavailable \u2014 this plan already routes around it, no manual replanning needed.`);
    } else if (state.spikePct > 0) {
      sentences.push(`Active scenario: <strong>${esc(state.disruptPort)}</strong> price is up ${state.spikePct}% \u2014 this plan already accounts for it.`);
    }
  }

  const congestedPorts = state.routePorts.filter(p => (PORTS_DB[p].congestionDays || 0) > 0);
  if (congestedPorts.length) {
    const totalDays = congestedPorts.reduce((sum, p) => sum + PORTS_DB[p].congestionDays, 0);
    const detail = congestedPorts.map(p => `${esc(p)} (+${PORTS_DB[p].congestionDays}d)`).join(", ");
    sentences.push(`Expect ${totalDays} day${totalDays === 1 ? "" : "s"} of berth-waiting delay on this route \u2014 ${detail} \u2014 already reflected in the arrival dates below.`);
  }

  return sentences.join(" ");
}

function renderRoadmap(d) {
  if (!d.optResult.feasible) return "";
  const plan = d.optResult.plan;
  const route = d.route;
  const vessel = d.vessel;
  const startDate = new Date(state.voyageStartDate ? state.voyageStartDate + "T00:00:00" : Date.now());
  let cumDays = 0, cumCost = 0;

  const rows = plan.map((p, i) => {
    cumDays += route[i].legDistanceNm / (vessel.actualSpeedKnots * 24);
    const arrival = new Date(startDate.getTime() + cumDays * 86400000);
    const arrivalStr = arrival.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    const congestionDays = PORTS_DB[p.port].congestionDays || 0;
    cumDays += congestionDays; // waiting time at this port delays every subsequent arrival
    const legCost = p.bunkerMt * (p.price >= 1e8 ? 0 : p.price);
    cumCost += legCost;
    // reconcile the final row to the optimiser's authoritative total exactly,
    // rather than the sum of individually-rounded per-leg display figures,
    // so this never shows a different number than the KPI card above it
    const displayCumCost = (i === plan.length - 1) ? d.optResult.totalCost : cumCost;
    const isBunker = p.bunkerMt > 1;
    const idleMt = route[i].idleConsumption || 0;
    const congestionNote = congestionDays > 0 ? ` <span style="color:var(--amber);" title="Expected berth-waiting delay at this port, plus auxiliary/hotel fuel burn while waiting">\u26a0 +${congestionDays}d congestion${idleMt > 0 ? ` (+${idleMt.toFixed(1)} MT idle)` : ""}</span>` : "";
    return `
      <tr style="border-bottom:1px solid var(--navy-line);">
        <td style="padding:9px 10px;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${isBunker ? "var(--teal)" : "var(--navy-line)"};margin-right:8px;"></span>${i === 0 ? "Depart" : i === plan.length - 1 ? "Final call" : "Call at"} <strong>${esc(p.port)}</strong>${congestionNote}</td>
        <td class="mono" style="padding:9px 10px;color:var(--slate);">${i === 0 ? "\u2014" : arrivalStr}</td>
        <td style="padding:9px 10px;${isBunker ? "color:var(--teal);" : "color:var(--slate);"}">${isBunker ? `Bunker ${p.bunkerMt.toLocaleString()} MT @ ${p.price >= 1e8 ? "n/a" : "$" + p.price.toFixed(0) + "/MT"}` : "Sail through \u2014 no bunkering"}</td>
        <td class="mono" style="padding:9px 10px;text-align:right;">${p.fuelAfterMt.toLocaleString()} MT</td>
        <td class="mono" style="padding:9px 10px;text-align:right;color:var(--slate);">${legCost > 0 ? "$" + Math.round(legCost).toLocaleString() : "\u2014"}</td>
        <td class="mono" style="padding:9px 10px;text-align:right;font-weight:600;">$${Math.round(displayCumCost).toLocaleString()}</td>
      </tr>`;
  }).join("");

  const totalCongestionDays = state.routePorts.reduce((sum, port) => sum + (PORTS_DB[port].congestionDays || 0), 0);
  const congestionSummary = totalCongestionDays > 0
    ? `<div style="font-size:11.5px;color:var(--amber);margin-top:8px;">\u26a0 This route includes ${totalCongestionDays} day${totalCongestionDays === 1 ? "" : "s"} of expected congestion delay across ${state.routePorts.filter(p => (PORTS_DB[p].congestionDays || 0) > 0).length} port(s) \u2014 arrival dates above already include it. Turn on "Include in totals" under Operational cost add-ons to also price it in dollars.</div>`
    : "";

  return `
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px;">
        <thead>
          <tr style="border-bottom:1px solid var(--navy-line);">
            <th style="padding:6px 10px;text-align:left;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;">Port call</th>
            <th style="padding:6px 10px;text-align:left;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;">Est. arrival</th>
            <th style="padding:6px 10px;text-align:left;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;">Action</th>
            <th style="padding:6px 10px;text-align:right;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;">Fuel after</th>
            <th style="padding:6px 10px;text-align:right;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;">Leg cost</th>
            <th style="padding:6px 10px;text-align:right;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;">Cumulative</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${congestionSummary}`;
}

// =============================================================================
// FLEET-WIDE IMPACT -- turns the single-voyage saving into the number an
// executive actually weighs a decision on. Both assumptions (how many
// vessels, how many voyages/year) are user-adjustable and shown explicitly
// rather than baked in silently.
// =============================================================================
function renderFleetImpact(d) {
  const hasSavings = d.savings !== null && d.savings > 0;
  const annual = hasSavings ? d.savings * state.fleetVesselsApplying * state.fleetVoyagesPerYear : null;

  return `
    <div class="card" style="padding:18px 20px;margin-bottom:16px;">
      <div class="disp" style="font-weight:700;font-size:15px;color:#fff;margin-bottom:4px;">\u26f4 Fleet-Wide Impact</div>

}

// =============================================================================
// OPERATIONAL COST ADD-ONS -- port dues/agency fee per call, plus a bunker
// delivery fee per port where fuel is actually taken. Deliberately layered
// ON TOP of the DP optimiser's result rather than fed into it: the DP only
// ranks ports by fuel price, so adding these afterward is a rough overlay,
// not a re-optimised plan. A fully joint optimisation would need these fees
// to influence WHICH ports get chosen, not just the total shown here --
// flagged explicitly in the UI copy below rather than silently overclaiming.
// Off and collapsed by default so it never changes any number unless the
// user opts in.
// =============================================================================
function computeOperationalCosts(s, d) {
  if (!s.opCostsEnabled || !d.optResult.feasible) {
    return { enabled: false, numCalls: 0, numBunkerCalls: 0, duesTotal: 0, deliveryTotal: 0, congestionDaysTotal: 0, congestionTotal: 0, addonTotal: 0 };
  }
  const numCalls = d.route.length;
  const numBunkerCalls = d.optResult.plan.filter(p => p.bunkerMt > 0.5).length;
  const duesTotal = numCalls * s.portDuesUsd;
  const deliveryTotal = numBunkerCalls * s.deliveryFeeUsd;
  const congestionDaysTotal = s.routePorts.reduce((sum, port) => sum + (PORTS_DB[port].congestionDays || 0), 0);
  const congestionTotal = congestionDaysTotal * s.congestionCostPerDay;
  return { enabled: true, numCalls, numBunkerCalls, duesTotal, deliveryTotal, congestionDaysTotal, congestionTotal, addonTotal: duesTotal + deliveryTotal + congestionTotal };
}

      ${open ? `

                style="width:100px;padding:5px 7px;border-radius:5px;background:var(--navy-deep);color:var(--fog);border:1px solid var(--navy-line);font-size:12.5px;font-family:inherit;">

          </div>

}

function renderGauges(d) {
  if (!d.optResult.feasible) {
    const msg = state.routePorts.length < 2 ? "Add at least two ports to see a plan." : "No feasible plan \u2014 tank capacity or safety buffer would be breached on this route.";
    return `<div style="color:var(--pil-red);font-size:13px;">${msg}</div>`;
  }
  const plan = d.optResult.plan;
  const maxBunker = Math.max(...plan.map(p => p.bunkerMt), 1);
  let html = `<div style="display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding-top:10px;">`;
  plan.forEach(p => {
    const isDisrupted = p.port === state.disruptPort;
    const isLngUnavailable = d.vessel.fuelGrade === "LNG" && !PORTS_DB[p.port].lngAvailable;
    const isLocked = isDisrupted || isLngUnavailable;
    const gaugeH = 8 + (p.bunkerMt / maxBunker) * 60;
    const barColor = isDisrupted ? (state.closed ? "#5a5a5a" : "var(--pil-red)") : isLngUnavailable ? "#5a5a5a" : (p.bunkerMt > 1 ? "var(--teal)" : "var(--navy-line)");

    // Price is editable right here, inline -- EXCEPT while this specific
    // port is actively under a stress-test scenario (temporary
    // spike/closure override, not the real reference price), or while the
    // selected vessel is LNG dual-fuel and this port simply can't supply
    // LNG at all (an availability constraint, not a price to edit).
    const priceField = isDisrupted
      ? `<div class="mono" style="font-size:9.5px;color:var(--slate);">${p.price >= 1e8 ? "CLOSED" : "$" + p.price.toFixed(0) + "/MT"}</div>`
      : isLngUnavailable
      ? `<div class="mono" style="font-size:9px;color:var(--slate);" title="This port does not supply LNG">NO LNG</div>`
      : `<div style="display:flex;align-items:center;gap:1px;">
           <span class="mono" style="font-size:9.5px;color:var(--slate);">$</span>
           <input type="number" class="mono gaugePriceInput" data-input="edit-port-price" data-port="${esc(p.port)}"
             value="${PORTS_DB[p.port].price}" min="0" step="1" title="Click to edit this port's reference price">
           <span class="mono" style="font-size:9.5px;color:var(--slate);">/MT</span>
         </div>`;

    html += `<div style="min-width:78px;display:flex;flex-direction:column;align-items:center;">
      <div style="height:74px;display:flex;align-items:flex-end;margin-bottom:8px;">
        <div style="width:20px;height:${p.bunkerMt > 1 ? gaugeH : 3}px;background:${barColor};border-radius:4px;" title="${p.bunkerMt} MT"></div>
      </div>
      <div style="font-size:10.5px;font-weight:600;text-align:center;">${esc(p.port)}</div>
      ${priceField}
      <div class="mono" style="font-size:10.5px;color:${p.bunkerMt > 1 ? "var(--teal)" : "var(--slate)"};margin-top:2px;">${p.bunkerMt > 1 ? `+${p.bunkerMt.toLocaleString()} MT` : "\u2014"}</div>
      ${(PORTS_DB[p.port].congestionDays || 0) > 0 ? `<div class="mono" style="font-size:9px;color:var(--amber);margin-top:2px;" title="Expected berth-waiting delay">\u26a0 ${PORTS_DB[p.port].congestionDays}d wait</div>` : ""}
    </div>`;
  });
  html += `</div>
  <div style="font-size:10.5px;color:var(--slate);margin-top:10px;">\u270f\ufe0f prices above are editable \u2014 click a number, type, and press Enter or click away</div>`;
  return html;
}

function renderLineChart(d) {
  if (!d.optResult.feasible) return `<div style="color:var(--slate);font-size:12.5px;padding:20px 0;">No data yet.</div>`;
  const trajectory = d.optResult.plan.map((p, i) => ({ port: p.port, opt: p.fuelAfterMt, jit: d.jitResult.feasible ? d.jitResult.plan[i].fuelAfterMt : null }));
  const W = 460, H = 220, padL = 44, padR = 12, padT = 10, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = trajectory.length;
  const xStep = n > 1 ? plotW / (n - 1) : 0;
  const cap = d.vessel.tankCapacityMt, buf = d.vessel.safetyBufferMt;
  const yMax = cap + 150, yMin = Math.max(0, buf - 400);
  const xPos = i => padL + i * xStep;
  const yPos = v => padT + plotH - (v - yMin) / (yMax - yMin) * plotH;

  let svg = "";
  svg += `<line x1="${padL}" y1="${yPos(buf)}" x2="${W - padR}" y2="${yPos(buf)}" stroke="var(--pil-red)" stroke-width="1.3" stroke-dasharray="4 4"/>`;
  svg += `<line x1="${padL}" y1="${yPos(cap)}" x2="${W - padR}" y2="${yPos(cap)}" stroke="var(--slate)" stroke-width="1.3" stroke-dasharray="2 2"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--navy-line)"/>`;
  svg += `<line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--navy-line)"/>`;

  const optPts = trajectory.map((t, i) => `${xPos(i)},${yPos(t.opt)}`).join(" ");
  svg += `<polyline points="${optPts}" fill="none" stroke="var(--teal)" stroke-width="2.4"/>`;
  trajectory.forEach((t, i) => svg += `<circle cx="${xPos(i)}" cy="${yPos(t.opt)}" r="3" fill="var(--teal)"/>`);

  if (trajectory.every(t => t.jit !== null)) {
    const jitPts = trajectory.map((t, i) => `${xPos(i)},${yPos(t.jit)}`).join(" ");
    svg += `<polyline points="${jitPts}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 3"/>`;
    trajectory.forEach((t, i) => svg += `<circle cx="${xPos(i)}" cy="${yPos(t.jit)}" r="3" fill="var(--amber)"/>`);
  }

  trajectory.forEach((t, i) => {
    const label = t.port.length > 9 ? t.port.slice(0, 8) + "\u2026" : t.port;
    svg += `<text x="${xPos(i)}" y="${H - padB + 16}" font-size="8.5" fill="var(--slate)" text-anchor="middle">${esc(label)}</text>`;
  });
  [yMin, (yMin + yMax) / 2, yMax].forEach(v => {
    svg += `<text x="${padL - 6}" y="${yPos(v) + 3}" font-size="8" fill="var(--slate)" text-anchor="end">${Math.round(v)}</text>`;
  });

  const legend = `<div style="display:flex;gap:14px;margin-bottom:6px;font-size:10.5px;">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:2px;margin-right:4px;"></span>Optimised</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:2px;margin-right:4px;"></span>Just-in-time</span>
  </div>`;
  return legend + `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${svg}</svg>`;
}

function renderBarChart(d) {
  if (!d.optResult.feasible) return `<div style="color:var(--slate);font-size:12.5px;padding:20px 0;">No data yet.</div>`;
  const bars = [
    { name: "Optimised", cost: d.optResult.totalCost, color: "var(--teal)", feasible: true },
    { name: "Just-in-time", cost: d.jitResult.feasible ? d.jitResult.totalCost : 0, color: "var(--amber)", feasible: d.jitResult.feasible },
  ];
  const W = 300, H = 220, padT = 24, padB = 30;
  const barW = 78, gap = 44;
  const feasibleCosts = bars.filter(b => b.feasible).map(b => b.cost);
  const maxV = Math.max(...feasibleCosts, 1);
  let svg = "";
  bars.forEach((b, i) => {
    const x = 24 + i * (barW + gap);
    if (!b.feasible) {
      const y = H - padB - 26;
      svg += `<rect x="${x}" y="${y}" width="${barW}" height="26" fill="none" stroke="var(--pil-red)" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>`;
      svg += `<text x="${x + barW / 2}" y="${y - 8}" font-size="9.5" fill="var(--pil-red)" text-anchor="middle" font-weight="600">INFEASIBLE</text>`;
      svg += `<text x="${x + barW / 2}" y="${H - padB + 15}" font-size="10" fill="var(--slate)" text-anchor="middle">${b.name}</text>`;
      return;
    }
    const h = (b.cost / maxV) * (H - padT - padB);
    const y = H - padB - h;
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${b.color}" rx="4"/>`;
    svg += `<text x="${x + barW / 2}" y="${y - 8}" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">$${(b.cost / 1e6).toFixed(2)}M</text>`;
    svg += `<text x="${x + barW / 2}" y="${H - padB + 15}" font-size="10" fill="var(--slate)" text-anchor="middle">${b.name}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${svg}</svg>`;
}

    <p style="color:var(--slate);font-size:14px;margin-bottom:20px;max-width:700px;">
      Set any start port, end port, and waypoints in between &mdash; the optimiser, route plot, and cost comparison all recompute live. Standalone HTML &mdash; no build tools, no internet connection required.
    </p>

    ${kpis}

    <div class="card" style="padding:18px 20px;margin-bottom:16px;border-color:var(--teal);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <div class="disp" style="font-weight:700;font-size:16px;color:#fff;">\u2691 Recommended Plan</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="font-size:11px;color:var(--slate);">Voyage departs</label>
          <input type="date" data-input="voyage-start-date" value="${state.voyageStartDate}"
            style="padding:4px 7px;border-radius:5px;background:var(--navy-deep);color:var(--fog);border:1px solid var(--navy-line);font-size:11.5px;font-family:inherit;">
        </div>
      </div>
      ${recommendationText ? `<p style="font-size:14px;line-height:1.6;color:var(--fog);margin:0 0 16px;">${recommendationText}</p>` : `<p style="font-size:13px;color:var(--slate);margin:0 0 16px;">Build a feasible route to see a recommendation.</p>`}
      ${opCosts.enabled ? `<p style="font-size:12.5px;color:var(--amber);margin:-8px 0 16px;">+ $${opCosts.addonTotal.toLocaleString()} in port dues &amp; delivery fees (operational add-ons, layered on top) \u2192 <strong>$${Math.round(d.optResult.totalCost + opCosts.addonTotal).toLocaleString()}</strong> all-in for this voyage.</p>` : ""}
      ${roadmapHtml}
    </div>

    ${fleetImpactHtml}
    ${opCostsHtml}

    <div class="mainGrid">
      <div style="display:flex;flex-direction:column;gap:16px;">

        <div class="card" style="padding:16px;">
          <div class="disp" style="font-weight:700;font-size:14px;margin-bottom:10px;">Vessel class</div>
          <div style="display:flex;gap:6px;margin-bottom:12px;">${vesselButtons}</div>

          <label class="fieldLabel"><span>Vessel</span></label>
          <select data-input="set-vessel-name" style="width:100%;margin-bottom:${d.vessel.fuelGrade === "LNG" ? "8" : "14"}px;padding:6px 8px;border-radius:5px;background:var(--navy-deep);color:var(--fog);border:1px solid var(--navy-line);font-size:12.5px;font-family:inherit;">${vesselNameOptions}</select>
          ${d.vessel.fuelGrade === "LNG" ? `<div style="font-size:10.5px;color:var(--amber);margin-bottom:12px;line-height:1.4;">\u26a0 LNG dual-fuel: bunkering is only possible at ports that supply LNG (Singapore, Rotterdam, Jebel Ali, Busan) &mdash; far fewer than VLSFO.</div>` : ""}

          <label class="fieldLabel"><span>Vessel speed</span><span class="mono">${state.speedKnots.toFixed(1)} kn</span></label>
          <input type="range" min="10" max="22" step="0.5" value="${state.speedKnots}" data-input="vessel-speed" style="margin-bottom:4px;">
          <div style="font-size:10px;color:var(--slate);margin-bottom:12px;line-height:1.4;">Design speed ${d.vessel.serviceSpeedKnots} kn \u2192 ~${Math.round(d.vessel.dailyConsumptionMt * Math.pow(state.speedKnots / d.vessel.serviceSpeedKnots, 3))} MT/day at this speed (${Math.round(Math.pow(state.speedKnots / d.vessel.serviceSpeedKnots, 3) * 100)}% of design rate)${state.speedKnots < d.vessel.serviceSpeedKnots ? " \u2014 slow steaming" : state.speedKnots > d.vessel.serviceSpeedKnots ? " \u2014 above design speed" : ""}</div>

          <label class="fieldLabel"><span>Starting fuel</span><span class="mono">${Math.round(state.startingFuel)} MT</span></label>
          <input type="range" min="${d.vessel.safetyBufferMt}" max="${d.vessel.tankCapacityMt}" step="50" value="${state.startingFuel}" data-input="starting-fuel" style="margin-bottom:12px;">

          <label class="fieldLabel"><span>Safety buffer</span><span class="mono">${state.buffer} MT</span></label>
          <input type="range" min="300" max="1000" step="50" value="${state.buffer}" data-input="buffer">
        </div>

        <div class="card" style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div class="disp" style="font-weight:700;font-size:14px;">Your route</div>
            <div style="display:flex;gap:10px;">
              <button class="iconBtn" title="Load SWS demo route" data-action="load-demo">${ICONS.reset}</button>
              <button class="iconBtn" title="Clear route" data-action="clear-route">${ICONS.trash}</button>
            </div>
          </div>
          ${renderChips(state)}
        </div>

        <div class="card" style="padding:16px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <span style="color:var(--pil-red)">${ICONS.warn}</span>
            <span class="disp" style="font-weight:700;font-size:14px;">Stress-test a scenario</span>
          </div>
          <label class="fieldLabel"><span>Disrupted port</span></label>
          <select data-input="disrupt-port" style="width:100%;margin-bottom:14px;padding:7px 9px;border-radius:6px;background:var(--navy-deep);color:var(--fog);border:1px solid var(--navy-line);font-size:12.5px;">${disruptOptions}</select>

          ${state.disruptPort !== "None" ? `
            <label class="fieldLabel"><span>Price spike</span><span class="mono">${state.spikePct}%</span></label>
            <input type="range" min="0" max="100" value="${state.spikePct}" data-input="spike-pct" ${state.closed ? "disabled" : ""} style="margin-bottom:12px;">
            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;">
              <input type="checkbox" data-input="closed" ${state.closed ? "checked" : ""}>
              Port unavailable (closure)
            </label>
          ` : ""}
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="card" style="padding:16px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div class="disp" style="font-weight:700;font-size:14px;">Interactive 3D route globe</div>
            <div style="font-size:10.5px;color:var(--slate);">great-circle projection &middot; schematic, not for navigation</div>
          </div>
          ${renderGlobePanel()}
        </div>

        <div class="card" style="padding:16px 18px;">
          <div class="disp" style="font-weight:700;font-size:14px;margin-bottom:14px;">Bunkering decisions by port</div>
          ${renderGauges(d)}
        </div>

        <div class="chartGrid">
          <div class="card" style="padding:16px 18px;">
            <div class="disp" style="font-weight:700;font-size:14px;margin-bottom:8px;">Fuel on board</div>
            ${renderLineChart(d)}
          </div>
          <div class="card" style="padding:16px 18px;">
            <div class="disp" style="font-weight:700;font-size:14px;margin-bottom:8px;">Total voyage cost</div>
            ${renderBarChart(d)}
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:16px 18px;margin-top:16px;">
      ${renderEditPanel(state)}
    </div>
  `;

  document.getElementById("app").innerHTML = html;
  drawGlobe();
}

// =============================================================================
// EVENTS (delegated -- app re-renders fully on any state change)
// =============================================================================
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "remove-port") {
    state.routePorts.splice(+el.dataset.idx, 1);
  } else if (action === "move-up") {
    const i = +el.dataset.idx;
    if (i > 0) [state.routePorts[i - 1], state.routePorts[i]] = [state.routePorts[i], state.routePorts[i - 1]];
  } else if (action === "move-down") {
    const i = +el.dataset.idx;
    if (i < state.routePorts.length - 1) [state.routePorts[i + 1], state.routePorts[i]] = [state.routePorts[i], state.routePorts[i + 1]];
  } else if (action === "set-vessel") {
    state.vesselClass = el.dataset.cls;
    state.vesselName = FLEET_VESSELS[state.vesselClass][0];
    state.startingFuel = VESSEL_CLASSES[state.vesselClass].startingFuelMt;
    state.buffer = VESSEL_CLASSES[state.vesselClass].safetyBufferMt;
    state.speedKnots = VESSEL_CLASSES[state.vesselClass].serviceSpeedKnots;
  } else if (action === "load-demo") {
    state.routePorts = [...DEFAULT_ROUTE];
    state.disruptPort = "None"; state.spikePct = 0; state.closed = false;
  } else if (action === "clear-route") {
    state.routePorts = [];
    state.disruptPort = "None";
  } else if (action === "reset-view") {
    viewRotation = { yaw: DEFAULT_YAW, pitch: DEFAULT_PITCH };
  } else if (action === "toggle-auto-rotate") {
    autoRotate = !autoRotate;
  } else if (action === "toggle-edit-panel") {
    state.editPanelOpen = !state.editPanelOpen;
  } else if (action === "toggle-opcosts") {
    state.opCostsOpen = !state.opCostsOpen;
  } else if (action === "export-data") {
    exportData();
    return; // no state change, no re-render needed
  } else if (action === "trigger-import") {
    document.getElementById("importFileInput").click();
    return;
  }
  render();
});

document.getElementById("app").addEventListener("change", e => {
  const el = e.target;
  if (el.id === "importFileInput") {
    if (el.files && el.files[0]) importData(el.files[0]);
    return;
  }
  if (!el.dataset.input) return;
  if (el.dataset.input === "starting-fuel") state.startingFuel = Number(el.value);
  else if (el.dataset.input === "buffer") state.buffer = Number(el.value);
  else if (el.dataset.input === "vessel-speed") state.speedKnots = Number(el.value);
  else if (el.dataset.input === "spike-pct") state.spikePct = Number(el.value);
  else if (el.dataset.input === "disrupt-port") { state.disruptPort = el.value; state.spikePct = 0; state.closed = false; }
  else if (el.dataset.input === "closed") state.closed = el.checked;
  else if (el.dataset.input === "voyage-start-date") state.voyageStartDate = el.value;
  else if (el.dataset.input === "set-vessel-name") state.vesselName = el.value;
  else if (el.dataset.input === "fleet-vessels") state.fleetVesselsApplying = Math.max(0, Number(el.value) || 0);
  else if (el.dataset.input === "fleet-voyages") state.fleetVoyagesPerYear = Math.max(0, Number(el.value) || 0);
  else if (el.dataset.input === "opcosts-enabled") state.opCostsEnabled = el.checked;
  else if (el.dataset.input === "edit-port-dues") state.portDuesUsd = Math.max(0, Number(el.value) || 0);
  else if (el.dataset.input === "edit-delivery-fee") state.deliveryFeeUsd = Math.max(0, Number(el.value) || 0);
  else if (el.dataset.input === "edit-congestion-cost") state.congestionCostPerDay = Math.max(0, Number(el.value) || 0);
  else if (el.dataset.input === "edit-idle-consumption") state.idleConsumptionMtPerDay = Math.max(0, Number(el.value) || 0);
  else if (el.dataset.input === "edit-port-congestion") {
    const days = Math.max(0, Math.round(Number(el.value) || 0));
    PORTS_DB[el.dataset.port].congestionDays = days;
  }
  else if (el.dataset.input === "edit-port-price") {
    const p = Math.max(0, Number(el.value) || 0);
    PORTS_DB[el.dataset.port].price = p;
  } else if (el.dataset.input === "edit-consumption") {
    VESSEL_CLASSES[state.vesselClass].dailyConsumptionMt = Math.max(1, Number(el.value) || 1);
  } else if (el.dataset.input === "edit-tank-capacity") {
    const cap = Math.max(100, Number(el.value) || 100);
    VESSEL_CLASSES[state.vesselClass].tankCapacityMt = cap;
    state.buffer = Math.min(state.buffer, cap - 50);
    state.startingFuel = Math.min(state.startingFuel, cap);
  }
  render();
});

// Export current port prices + vessel specs to a small JSON file the user
// keeps on their own computer -- and can Import back in later, so edits
// survive reopening the dashboard without needing any server or build step.
function exportData() {
  const payload = {
    ports: Object.fromEntries(Object.entries(PORTS_DB).map(([k, v]) => [k, v.price])),
    vessels: Object.fromEntries(Object.entries(VESSEL_CLASSES).map(([k, v]) => [k, { dailyConsumptionMt: v.dailyConsumptionMt, tankCapacityMt: v.tankCapacityMt }])),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pil_bunkering_data.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (data.ports) Object.entries(data.ports).forEach(([name, price]) => { if (PORTS_DB[name]) PORTS_DB[name].price = Number(price); });
      if (data.vessels) Object.entries(data.vessels).forEach(([cls, v]) => { if (VESSEL_CLASSES[cls]) Object.assign(VESSEL_CLASSES[cls], v); });
      render();
    } catch (err) {
      alert("Couldn't read that file \u2014 make sure it's a .json file exported from this dashboard.");
    }
  };
  reader.readAsText(file);
}

// live number feedback while dragging sliders, without a full re-render
document.getElementById("app").addEventListener("input", e => {
  const el = e.target;
  if (el.type !== "range") return;
  const label = el.previousElementSibling;
  if (label && label.tagName === "LABEL") {
    const span = label.querySelector(".mono");
    if (span) span.textContent = `${el.value}${el.dataset.input === "spike-pct" ? "%" : el.dataset.input === "vessel-speed" ? " kn" : " MT"}`;
  }
});

// =============================================================================
// GLOBE INTERACTION -- drag to rotate, click (no-drag) a port to add it.
// Deliberately bypasses the full render() cycle while dragging: only
// viewRotation changes, so we redraw just the canvas for smooth 60fps
// rotation instead of rebuilding the whole page's HTML every frame.
// =============================================================================
document.getElementById("app").addEventListener("mousedown", e => {
  if (e.target.id !== "globeCanvas") return;
  isDragging = true; dragMoved = false;
  dragStart = { x: e.clientX, y: e.clientY };
  dragStartRotation = { ...viewRotation };
  e.preventDefault();
});

document.addEventListener("mousemove", e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
  viewRotation.yaw = dragStartRotation.yaw + dx * 0.008;
  viewRotation.pitch = Math.max(-1.45, Math.min(1.45, dragStartRotation.pitch - dy * 0.008));
  drawGlobe();
});

document.addEventListener("mouseup", e => {
  if (!isDragging) return;
  isDragging = false;
  if (!dragMoved) {
    const hit = hitTestPort(e.clientX, e.clientY);
    if (hit && !state.routePorts.includes(hit)) { state.routePorts.push(hit); render(); }
  }
});

document.getElementById("app").addEventListener("touchstart", e => {
  if (e.target.id !== "globeCanvas") return;
  const t = e.touches[0];
  isDragging = true; dragMoved = false;
  dragStart = { x: t.clientX, y: t.clientY };
  dragStartRotation = { ...viewRotation };
}, { passive: true });

document.addEventListener("touchmove", e => {
  if (!isDragging) return;
  const t = e.touches[0];
  const dx = t.clientX - dragStart.x, dy = t.clientY - dragStart.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
  viewRotation.yaw = dragStartRotation.yaw + dx * 0.008;
  viewRotation.pitch = Math.max(-1.45, Math.min(1.45, dragStartRotation.pitch - dy * 0.008));
  drawGlobe();
  e.preventDefault();
}, { passive: false });

document.addEventListener("touchend", e => {
  if (!isDragging) return;
  isDragging = false;
  if (!dragMoved) {
    const t = e.changedTouches[0];
    const hit = hitTestPort(t.clientX, t.clientY);
    if (hit && !state.routePorts.includes(hit)) { state.routePorts.push(hit); render(); }
  }
});

(function animLoop() {
  if (autoRotate && !isDragging) { viewRotation.yaw += 0.004; drawGlobe(); }
  requestAnimationFrame(animLoop);
})();

render();
</script>
</body>
</html>
